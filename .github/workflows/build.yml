name: Build ForceFullRes dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify files exist
        run: |
          echo "Listing repo:"
          ls -R .

      - name: Build ForceFullRes.dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 \
                -dynamiclib \
                -isysroot $SDK_PATH \
                -framework UIKit \
                -framework OpenGLES \
                -fobjc-arc \
                ForceFullRes.m fishhook.c \
                -o ForceFullRes.dylib \
                || (echo "BUILD FAILED"; exit 1)

          ls -lh ForceFullRes.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForceFullRes-dylib
          path: ForceFullRes.dylib
